
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울 맛집 지도</title>

  <!-- 카카오맵 JavaScript SDK 불러오기 -->
  <!-- 아래 YOUR_JAVASCRIPT_KEY를 내 JavaScript 키로 교체 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_JAVASCRIPT_KEY&libraries=services">
  </script>

  <style>
    /* 기본 화면 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    /* 왼쪽 검색 영역과 오른쪽 지도 영역을 2분할 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 검색창 및 결과 리스트 */
    .sidebar {
      width: 350px;
      flex-shrink: 0;
      padding: 24px;
      background-color: #ffffff;
      border-right: 1px solid #dddddd;
      overflow-y: auto;
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
      color: #222222;
    }

    .description {
      margin-bottom: 22px;
      color: #777777;
      font-size: 14px;
      line-height: 1.6;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    #keyword {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 14px;
    }

    #searchButton {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background-color: #f4a261;
      color: white;
      cursor: pointer;
    }

    #searchButton:hover {
      background-color: #e58b42;
    }

    #status {
      margin: 20px 0 10px;
      color: #666666;
      font-size: 13px;
    }

    #resultList {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .place-item {
      padding: 15px 5px;
      border-bottom: 1px solid #eeeeee;
      cursor: pointer;
    }

    .place-item:hover {
      background-color: #fff7ef;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    /* 작은 화면에서는 검색창과 지도를 위아래로 배치 */
    @media (max-width: 650px) {
      .container {
        flex-direction: column;
        height: 100vh;
      }

      .sidebar {
        width: 100%;
        height: 45%;
        padding: 16px;
      }

      #map {
        width: 100%;
        height: 55%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽 검색 영역 -->
    <aside class="sidebar">
      <h1>🍽️ 서울 맛집 지도</h1>

      <p class="description">
        내 주변 맛집을 찾아보고<br>
        새로운 장소를 탐색해 보세요!
      </p>

      <div class="search-box">
        <input
          type="text"
          id="keyword"
          placeholder="장소 검색 기능은 STEP 2에서 추가"
        >
        <button id="searchButton" type="button">검색</button>
      </div>

      <p id="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </p>

      <ul id="resultList"></ul>
    </aside>

    <!-- 오른쪽 지도 영역 -->
    <div id="map"></div>

  </div>

  <script>
    // 지도 객체를 저장할 변수
    let map;

    // 현재 위치를 기본 위치로 사용하고, 실패하면 서울 시청을 사용
    function initializeMap() {
      const defaultPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      // 우선 서울 시청을 중심으로 지도 생성
      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: defaultPosition,
          level: 5
        }
      );

      document.getElementById("status").textContent =
        "현재 위치를 확인하고 있습니다.";

      // 브라우저의 위치 정보 기능 확인
      if (!navigator.geolocation) {
        document.getElementById("status").textContent =
          "위치 기능을 지원하지 않아 서울 시청을 중심으로 표시합니다.";
        return;
      }

      // 사용자의 위치 권한을 요청
      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 현재 위도와 경도를 지도 좌표로 변환
          const currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          // 현재 위치를 중심으로 지도 이동
          map.setCenter(currentPosition);

          // 현재 위치에 마커 표시
          new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "내 현재 위치"
          });

          document.getElementById("status").textContent =
            "현재 위치를 중심으로 지도를 표시합니다.";
        },

        function () {
          // 위치 권한을 거부하거나 위치 확인에 실패한 경우
          document.getElementById("status").textContent =
            "현재 위치를 확인할 수 없어 서울 시청을 표시합니다.";
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 카카오맵 SDK가 준비된 다음 지도 초기화
    window.addEventListener("load", function () {
      if (typeof kakao === "undefined" || !kakao.maps) {
        document.getElementById("status").textContent =
          "지도 로딩에 실패했습니다. JavaScript 키와 도메인 설정을 확인하세요.";
        return;
      }

      kakao.maps.load(function () {
        initializeMap();
      });
    });

    // STEP 2에서 검색 기능을 연결할 버튼
    document.getElementById("searchButton").addEventListener(
      "click",
      function () {
        document.getElementById("status").textContent =
          "장소 검색 기능은 STEP 2에서 추가합니다.";
      }
    );
  </script>
</body>
</html>
